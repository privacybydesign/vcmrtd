name: mrz_capture
description: MRZ capture — camera viewfinder, framing overlay, both OCR engines and the manual entry fallback

version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  vcmrtd:
    path: ../vcmrtd
  camera: ^0.12.0
  flutter_platform_widgets: ^9.0.0
  google_mlkit_text_recognition: ^0.17.1
  intl: ^0.20.2
  logging: ^1.3.0
  mrz_parser:
    git:
      url: https://github.com/privacybydesign/mrz_parser.git
      ref: v3.0.0
  opencv_dart: ^2.2.2

dev_dependencies:
  camera_platform_interface: ^2.13.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  plugin_platform_interface: ^2.1.8

flutter:
  # Generates lib/l10n/mrz_capture_localizations.dart from lib/l10n/*.arb - see l10n.yaml.
  generate: true
  plugin:
    platforms:
      # Tesseract4Android is the free software OCR engine and is Android-only.
      # Google ML Kit needs no platform code here: its own plugin provides that.
      android:
        package: foundation.privacybydesign.mrzcapture
        pluginClass: TesseractOcrPlugin

# opencv_dart compiles OpenCV from source in its build hook (CMake needed);
# only imgproc is used, so the rest is left out of the app.
hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgproc
