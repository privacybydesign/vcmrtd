# Delivery workflow for the master branch.
# We execute build stages in separate jobs to prevent artifact duplication.
#
# Two tracks:
#   alpha — ad hoc (iOS) and alpha-flavor (Android) builds on every push, for
#           internal distribution. Ad hoc builds do not need unique build
#           numbers, so no version bump is required.
#   beta  — app-store (iOS) and Play-upload-key (Android) builds, produced only
#           when the version in idem/pubspec.yaml changes, because the stores
#           reject a build number they have already seen.
name: Delivery

on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency: ${{ github.ref }}

env:
  PROOFING_TRUSTED_SERVERS: ${{ vars.PROOFING_TRUSTED_SERVERS }}

jobs:
  build-app-ios-alpha:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    defaults:
      run:
        working-directory: ./idem
    environment: app-store-ad-hoc
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > ./fastlane/profiles/apple_distribution.p12
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/ad_hoc_alpha.mobileprovision
      - name: Build app
        run: >
          bundle exec fastlane ios_build_app
          flavor:alpha
          code_signing_identity:"iPhone Distribution"
          certificate_path:profiles/apple_distribution.p12
          certificate_password:${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/ad_hoc_alpha.mobileprovision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-alpha-ios
          path: ./idem/fastlane/build/*.ipa
  build-app-android-alpha:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./idem
    environment: android-alpha
    strategy:
      matrix:
        type: [apk, appbundle]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
      - name: Build app
        run: >
          bundle exec fastlane android_build_${{ matrix.type }}
          flavor:alpha
          keystore_path:profiles/keystore.jks
          key_alias:${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keystore_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-alpha-android-${{ matrix.type }}
          path: |
            ./idem/fastlane/build/*.apk
            ./idem/fastlane/build/*.aab
  bundle-app-alpha:
    runs-on: ubuntu-latest
    needs:
      - build-app-ios-alpha
      - build-app-android-alpha
    steps:
      - name: Download app-alpha-ios artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-ios
      - name: Download app-alpha-android-apk artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-apk
      - name: Download app-alpha-android-appbundle artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-alpha-android-appbundle
      - name: Bundle all artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-bundle-alpha
          path: .
  version-check:
    runs-on: ubuntu-latest
    needs: bundle-app-alpha
    outputs:
      version-changed: ${{ steps.detection.outcome == 'success' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      # The stores key a release on the build number (the +N suffix), and reject
      # one they have already seen. So the beta track triggers on that number
      # increasing, not on any change to the version line — bumping only the
      # semver would otherwise produce a build that both stores refuse.
      - name: Detect build number increase
        id: detection
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          build_number() {
            sed -n 's/^version: [0-9]*\.[0-9]*\.[0-9]*+\([0-9]*\)$/\1/p' | head -n1
          }
          before=$(git show "$BEFORE_SHA:idem/pubspec.yaml" 2>/dev/null | build_number)
          after=$(build_number < ./idem/pubspec.yaml)

          echo "before=${before:-<none>} after=${after:-<none>}"

          if [ -z "$after" ]; then
            echo "No parseable build number in idem/pubspec.yaml"
            exit 1
          fi
          # No previous revision (first push, force push, or a reworked history)
          # is not a bump; requiring a real increase keeps this from firing by
          # accident and burning a build number.
          if [ -z "$before" ]; then
            echo "Could not read the previous build number; treating as no bump"
            exit 1
          fi
          [ "$after" -gt "$before" ]
        shell: bash
        continue-on-error: true
  # Every other merge to master validates the same upload path without
  # publishing, so a credential, entitlement or manifest problem is caught on
  # the merge that introduced it rather than on the release that needed it.
  dry-run:
    needs: version-check
    if: needs.version-check.outputs.version-changed != 'true'
    uses: ./.github/workflows/dry-run-distribution.yml
    # The dry-run jobs run in the app-store-beta and android-beta environments,
    # whose secrets take precedence over the ones passed here.
    secrets:
      APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
  build-app-ios-beta:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    defaults:
      run:
        working-directory: ./idem
    needs: version-check
    if: needs.version-check.outputs.version-changed == 'true'
    environment: app-store-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          APPLE_DISTRIBUTION_CERTIFICATE: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DISTRIBUTION_CERTIFICATE" | base64 --decode > ./fastlane/profiles/apple_distribution.p12
          echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/app_store_beta.mobileprovision
      - name: Build app
        run: >
          bundle exec fastlane ios_build_app
          flavor:beta
          code_signing_identity:"iPhone Distribution"
          certificate_path:profiles/apple_distribution.p12
          certificate_password:${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/app_store_beta.mobileprovision
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-beta-ios
          path: ./idem/fastlane/build/*.ipa
      # Uploading after the artifact step means a TestFlight outage or a
      # rejected build still leaves a downloadable IPA on the run.
      - name: Decode App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: echo "$APP_STORE_CONNECT_KEY" | base64 --decode > ./fastlane/profiles/app_store_connect_key.p8
      - name: Upload to TestFlight
        run: >
          bundle exec fastlane ios_upload_testflight
          key_id:${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          issuer_id:${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          key_filepath:profiles/app_store_connect_key.p8
  build-app-android-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./idem
    needs: version-check
    if: needs.version-check.outputs.version-changed == 'true'
    environment: android-beta
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          ANDROID_SIGNING_KEYSTORE: ${{ secrets.ANDROID_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
      - name: Build app
        run: >
          bundle exec fastlane android_build_appbundle
          flavor:beta
          keystore_path:profiles/keystore.jks
          key_alias:${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keystore_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-beta-android
          path: |
            ./idem/fastlane/build/*.apk
            ./idem/fastlane/build/*.aab
      # See the note in build-app-ios-beta on step ordering.
      - name: Decode Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 --decode > ./fastlane/profiles/play_service_account.json
      - name: Upload to the Play Store
        run: >
          bundle exec fastlane android_upload_play_store
          json_key_path:profiles/play_service_account.json
  bundle-app-beta:
    runs-on: ubuntu-latest
    needs:
      - build-app-ios-beta
      - build-app-android-beta
    steps:
      - name: Download app-beta-ios artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-beta-ios
      - name: Download app-beta-android artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-beta-android
      - name: Bundle all artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-bundle-beta
          path: .
