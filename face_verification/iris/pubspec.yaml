name: face_verification_iris
description: Face verification via the vendor Iris SDK — an alternate engine alongside face_verification, not part of its pipeline.

version: 1.0.0
publish_to: none

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: foundation.privacybydesign.faceverificationiris
        pluginClass: FaceVerificationIrisPlugin
      ios:
        pluginClass: FaceVerificationIrisPlugin
