# Status checks, using the shared workflows from privacybydesign/github-workflows.
# The gate job "Status checks passed" is the one check to require.
#
# There is no shared Flutter workflow, so the Flutter lint, tests, SonarQube
# scan and the development-signed app builds stay local jobs here.
name: Status checks

on:
  push:
    branches: [master]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions: {}

env:
  PROOFING_TRUSTED_SERVERS: ${{ vars.PROOFING_TRUSTED_SERVERS }}

# A new push to a PR cancels the PR's previous run. Other events get a
# group of their own (run_id), so they never wait for or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./idem
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane lint

  unit-test:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Run vcmrtd tests with coverage
        working-directory: ./vcmrtd
        run: flutter test --coverage
      - name: Run face_verification tests with coverage
        working-directory: ./face_verification
        run: flutter test --coverage
      - name: Run mrz_capture tests with coverage
        working-directory: ./mrz_capture
        run: flutter test --coverage
      - name: Upload vcmrtd coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: vcmrtd/coverage/lcov.info
          flags: vcmrtd
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload face_verification coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: face_verification/coverage/lcov.info
          flags: face_verification
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload mrz_capture coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: mrz_capture/coverage/lcov.info
          flags: mrz_capture
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Run vcmrtd tests with coverage
        working-directory: ./vcmrtd
        run: flutter test --coverage
      - name: Run app tests with coverage
        working-directory: ./idem
        run: flutter test --coverage
      - name: Run face_verification tests with coverage
        working-directory: ./face_verification
        run: flutter test --coverage
      - name: Run mrz_capture tests with coverage
        working-directory: ./mrz_capture
        run: flutter test --coverage
      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          {
            sed 's|SF:lib/|SF:vcmrtd/lib/|g' vcmrtd/coverage/lcov.info
            sed 's|SF:lib/|SF:idem/lib/|g' idem/coverage/lcov.info
            sed 's|SF:lib/|SF:face_verification/lib/|g' face_verification/coverage/lcov.info
            sed 's|SF:lib/|SF:mrz_capture/lib/|g' mrz_capture/coverage/lcov.info
          } > coverage/lcov.info
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Development builds, signed with a development certificate and a separate
  # development keystore — never the distribution credentials, which stay in the
  # protected environments used by delivery.yml.
  #
  # Signing here means a pull request exercises the same signing path a release
  # does, so a broken certificate or profile surfaces on the change that caused
  # it. The cost is that these secrets are repository-level, so builds on pull
  # requests from forks will fail — forks are never given secrets.
  build-app-android:
    runs-on: ubuntu-24.04
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./idem
    strategy:
      matrix:
        flavor: [alpha, beta]
        type: [apk, appbundle]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          ANDROID_DEVELOPMENT_SIGNING_KEYSTORE: ${{ secrets.ANDROID_DEVELOPMENT_SIGNING_KEYSTORE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$ANDROID_DEVELOPMENT_SIGNING_KEYSTORE" | base64 --decode > ./fastlane/profiles/keystore.jks
      - name: Build
        run: >
          bundle exec fastlane android_build_${{ matrix.type }}
          flavor:${{ matrix.flavor }}
          keystore_path:profiles/keystore.jks
          key_alias:idem-development
          keystore_password:${{ secrets.ANDROID_DEVELOPMENT_SIGNING_KEYSTORE_PASSWORD }}
          key_password:${{ secrets.ANDROID_DEVELOPMENT_SIGNING_KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-android-${{ matrix.flavor }}-${{ matrix.type }}
          path: ./idem/fastlane/build/*

  # Catches iOS compile and signing breakage on every pull request, which
  # nothing did before: the iOS build only ever ran on master, if at all.
  # A development identity makes ios_build_app export with the development
  # method, so the IPA installs on the devices in the development profile.
  build-app-ios:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    needs: lint
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./idem
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Decode binary environment secrets
        env:
          APPLE_DEVELOPMENT_CERTIFICATE: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE }}
          APPLE_DEVELOPMENT_PROVISIONING_PROFILE: ${{ secrets.APPLE_DEVELOPMENT_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ./fastlane/profiles
          echo "$APPLE_DEVELOPMENT_CERTIFICATE" | base64 --decode > ./fastlane/profiles/ios_development.p12
          echo "$APPLE_DEVELOPMENT_PROVISIONING_PROFILE" | base64 --decode > ./fastlane/profiles/development.mobileprovision
      - name: Build
        run: >
          bundle exec fastlane ios_build_app
          flavor:alpha
          certificate_path:profiles/ios_development.p12
          certificate_password:${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
          provisioning_profile_path:profiles/development.mobileprovision
          code_signing_identity:"iPhone Developer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-dev-ios
          path: ./idem/fastlane/build/*.ipa

  # Docusaurus site published to GitHub Pages (privacybydesign.github.io/vcmrtd).
  docs:
    uses: privacybydesign/github-workflows/.github/workflows/node-checks.yml@v1
    permissions:
      contents: read
    with:
      working-directory: vcmrtd/docs
      scripts: typecheck build
      ignore-scripts: true

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: privacybydesign/github-workflows/.github/workflows/dependency-review.yml@v1
    permissions:
      contents: read
      pull-requests: write

  workflow-lint:
    uses: privacybydesign/github-workflows/.github/workflows/workflow-lint.yml@v1
    permissions:
      contents: read

  passed:
    name: Status checks passed
    if: always()
    needs: [lint, unit-test, sonarqube, build-app-android, build-app-ios, docs, dependency-review, workflow-lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
