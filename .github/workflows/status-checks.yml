# Workflow to check whether changes to master fulfill all requirements.
name: Status checks

on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    # Run every monday on 9:00 in the morning (UTC).
    - cron: "0 9 * * 1"
  # Make it possible to trigger the checks manually.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./idem
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - run: bundle exec fastlane lint

  unit-test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Run vcmrtd tests with coverage
        working-directory: ./vcmrtd
        run: flutter test --coverage
      - name: Run face_verification tests with coverage
        working-directory: ./face_verification
        run: flutter test --coverage
      - name: Run mrz_capture tests with coverage
        working-directory: ./mrz_capture
        run: flutter test --coverage
      - name: Upload vcmrtd coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: vcmrtd/coverage/lcov.info
          flags: vcmrtd
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload face_verification coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: face_verification/coverage/lcov.info
          flags: face_verification
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload mrz_capture coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: mrz_capture/coverage/lcov.info
          flags: mrz_capture
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Run vcmrtd tests with coverage
        working-directory: ./vcmrtd
        run: flutter test --coverage
      - name: Run app tests with coverage
        working-directory: ./idem
        run: flutter test --coverage
      - name: Run face_verification tests with coverage
        working-directory: ./face_verification
        run: flutter test --coverage
      - name: Run mrz_capture tests with coverage
        working-directory: ./mrz_capture
        run: flutter test --coverage
      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          sed 's|SF:lib/|SF:vcmrtd/lib/|g' vcmrtd/coverage/lcov.info > coverage/lcov.info
          sed 's|SF:lib/|SF:idem/lib/|g' idem/coverage/lcov.info >> coverage/lcov.info
          sed 's|SF:lib/|SF:face_verification/lib/|g' face_verification/coverage/lcov.info >> coverage/lcov.info
          sed 's|SF:lib/|SF:mrz_capture/lib/|g' mrz_capture/coverage/lcov.info >> coverage/lcov.info
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Development builds. Unlike the alpha and beta tracks in delivery.yml these
  # are deliberately unsigned, so they need no secrets and therefore still run
  # on pull requests from forks. The Gradle config falls back to the debug
  # signing config when no keystore property is passed, so the APKs are still
  # installable for manual testing.
  build-app-android:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: ./idem
    strategy:
      matrix:
        flavor: [alpha, beta]
        type: [apk, appbundle]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Build
        run: bundle exec fastlane android_build_${{ matrix.type }} flavor:${{ matrix.flavor }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-android-${{ matrix.flavor }}-${{ matrix.type }}
          path: ./idem/fastlane/build/*
  # Catches iOS compile breakage on every pull request, which nothing did
  # before: the iOS build only ever ran on master, if at all. No code signing,
  # so this needs no certificate and works on forks.
  build-app-ios:
    runs-on: macos-15 # MacOS version is pinned, because it determines which XCode version is used.
    needs: lint
    defaults:
      run:
        working-directory: ./idem
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-build-environment
      - name: Build
        run: flutter build ios --release --no-codesign
