name: Setup build environment
description: This action installs all build tools needed for vcmrtd and caches the result to speed up future runs.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: 17
    - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
      id: setup-ruby
      with:
        ruby-version: 3.4
    - name: Check Ruby cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: idem/rubyvendor/
        # Native gems link against the exact Ruby build, so a patch bump of the
        # runner's Ruby must not restore gems compiled for the previous one.
        key: ruby-${{ runner.os }}-${{ steps.setup-ruby.outputs.ruby-prefix }}-${{ hashFiles('idem/Gemfile.lock') }}
    - run: bundle install
      shell: bash
      working-directory: ./idem
    - name: Set environment variables
      # Only fixed paths under $HOME are written here, nothing from the event or the repository.
      run: | # zizmor: ignore[github-env]
        ANDROID_HOME=~/android-sdk
        FLUTTER_HOME=~/flutter
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk-bundle" >> "$GITHUB_ENV"
        echo "FLUTTER_HOME=$FLUTTER_HOME" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/cmdline-tools/bin" >> "$GITHUB_PATH"
        echo "$FLUTTER_HOME/bin" >> "$GITHUB_PATH"
      shell: bash
    - name: Check ci_scripts cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
      with:
        path: |
          ${{ env.ANDROID_HOME }}
          ${{ env.FLUTTER_HOME }}
        key: ci_scripts-${{ runner.os }}-${{ hashFiles('ci_scripts/*') }}
    - name: Ensure Android SDK is installed
      if: runner.os == 'Linux'
      run: ./ci_scripts/install_android_sdk.sh
      shell: bash
    - name: Ensure Flutter is installed
      run: ./ci_scripts/install_flutter.sh
      shell: bash
    - name: Use correct Xcode version
      if: runner.os == 'macOS'
      # Apple rejects uploads built with an SDK older than iOS 26, which means
      # Xcode 26 or later. 16.4 is the image default, so this must be explicit.
      run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      shell: bash
    - name: Check Cocoapods cache
      id: cocoapods-cache
      if: runner.os == 'macOS'
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: idem/ios/Pods
        key: cocoapods-${{ runner.os }}-${{ hashFiles('idem/Gemfile.lock', 'idem/pubspec.lock', 'idem/ios/Podfile.lock') }}
    - name: Pre-install Cocoapods to fill cache
      if: runner.os == 'macOS' && steps.cocoapods-cache.outputs.cache-hit != 'true'
      run: |
        flutter pub get
        cd ios && pod install
      shell: bash
      working-directory: ./idem
