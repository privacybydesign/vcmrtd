sonar.projectKey=privacybydesign_vcmrtd
sonar.organization=privacybydesign

# Disable C/C++/Objective-C analysis (no compilation database available)
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.sources=vcmrtd/lib,idem/lib,face_verification/lib,mrz_capture/lib
sonar.tests=vcmrtd/test,idem/test,face_verification/test,mrz_capture/test

# Coverage report merged from all packages by CI
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Generated by `flutter gen-l10n` - not hand-written, so no coverage or duplication gate
sonar.coverage.exclusions=idem/lib/l10n/app_localizations*.dart,mrz_capture/lib/l10n/mrz_capture_localizations*.dart
sonar.cpd.exclusions=idem/lib/l10n/app_localizations*.dart,mrz_capture/lib/l10n/mrz_capture_localizations*.dart
